# THIS COMPOSE IS TEMP AND FOR DEVELOPMENT PURPOSES ONLY
services:
  # MySQL service
  mysql:
    image: "mysql:latest"
    env_file: .env
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_USER=${DB_USERNAME}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - uitland-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service
  redis:
    image: "redis:latest"
    volumes:
      - redis-data:/data
    networks:
      - uitland-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama service
  ollama:
    image: "ollama/ollama:latest"
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - uitland-network
    # healthcheck:
    #   test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
    #   interval: 30s
    #   timeout: 20s
    #   retries: 5
    #   start_period: 120s

  # Milvus etcd service
  # etcd:
  #   container_name: milvus-etcd
  #   image: quay.io/coreos/etcd:v3.5.18
  #   environment:
  #     - ETCD_AUTO_COMPACTION_MODE=revision
  #     - ETCD_AUTO_COMPACTION_RETENTION=1000
  #     - ETCD_QUOTA_BACKEND_BYTES=4294967296
  #     - ETCD_SNAPSHOT_COUNT=50000
  #   volumes:
  #     - etcd-data:/etcd
  #   command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
  #   healthcheck:
  #     test: ["CMD", "etcdctl", "endpoint", "health"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3
  #   networks:
  #     - uitland-network

  # MinIO service
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - uitland-network

  # Milvus standalone service
  # standalone:
  #   container_name: milvus-standalone
  #   image: milvusdb/milvus:v2.6.6
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     ETCD_ENDPOINTS: etcd:2379
  #     MINIO_ADDRESS: minio:9000
  #     MQ_TYPE: woodpecker
  #   volumes:
  #     - milvus-data:/var/lib/milvus
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     interval: 30s
  #     start_period: 90s
  #     timeout: 20s
  #     retries: 3
  #   depends_on:
  #     - "etcd"
  #     - "minio"
  #   networks:
  #     - uitland-network

  # Kafka service in KRaft mode
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - uitland-network

  # Kafka UI service
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8762:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - uitland-network

  # ClamAV service
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - uitland-network

  # Imgproxy service
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    container_name: imgproxy
    ports:
      - "8081:8081"
    environment:
      IMGPROXY_BIND: :8081
      IMGPROXY_KEY: 3b36d1b62634689b28636a633eeb42b39aae91d40fb3bf1e53dd4d48abbf2166
      IMGPROXY_SALT: f94a17684703c3a7f3aec1dad5ad1f37b8a5fa07bd19843704070b46eb10580a
      IMGPROXY_USE_S3: true
      IMGPROXY_S3_REGION: local
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: true
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      IMGPROXY_ALLOW_ORIGIN: "*" # Allow all origins for CORS (for testing purposes)
      IMGPROXY_USE_ETAG: true # Enable ETag headers for caching
    depends_on:
      - minio
    networks:
      - uitland-network
  app:
    build:
      context: ../../
      dockerfile: docker/pro/Dockerfile
    # image: dnhphong2005/uitland-backend:latest
    container_name: uitland-backend-pro
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: pro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started # service_healthy if healthcheck is enabled
      # standalone:
      #   condition: service_healthy
      kafka:
        condition: service_started
      clamav:
        condition: service_started
      imgproxy:
        condition: service_started
    networks:
      - uitland-network

networks:
  uitland-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  ollama-data:
  etcd-data:
  minio-data:
  milvus-data:
  kafka-data:
  clamav-data:
