<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mã xác thực của bạn</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f4f6;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .wrapper {
        padding: 40px 10px;
        background-color: #f3f4f6;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }
      .content {
        padding: 40px;
        text-align: center;
      }
      .logo {
        font-size: 32px;
        font-weight: bold;
        color: #2563eb;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 22px;
        color: #1f2937;
        margin-bottom: 8px;
      }
      p {
        color: #6b7280;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 32px;
      }
      .code-container {
        background-color: #f8fafc;
        border: 2px dashed #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 32px;
      }
      .verification-code {
        font-family: 'Courier New', Courier, monospace;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 8px;
        color: #111827;
        margin: 0;
      }
      .expiry-notice {
        font-size: 13px;
        color: #9ca3af;
      }
      .footer {
        background-color: #f9fafb;
        padding: 20px;
        text-align: center;
        border-top: 1px solid #f1f5f9;
      }
      .footer p {
        font-size: 12px;
        margin: 0;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="content">
          <div class="logo">SecureApp</div>
          <h1>Mã xác thực OTP</h1>
          <p>Sử dụng mã dưới đây để hoàn tất quá trình xác thực. Mã này sẽ hết hạn sau 10 phút.</p>
          
          <div class="code-container">
            <div class="verification-code" th:text="${otpCode}"/>
          </div>

          <p class="expiry-notice">
            Để bảo mật, vui lòng không chia sẻ mã này với bất kỳ ai.
          </p>
        </div>
        
        <div class="footer">
          <p>Đây là email tự động, vui lòng không phản hồi.</p>
          <p>&copy; 2024 Your Company</p>
        </div>
      </div>
    </div>
  </body>
</html>
